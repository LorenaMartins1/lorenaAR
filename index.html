<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">

  <!-- Model Viewer -->
  <script type="module" src="https://unpkg.com/@google/model-viewer/dist/model-viewer.min.js"></script>

  <!-- Partículas -->
  <script src="https://cdn.jsdelivr.net/npm/tsparticles@2/tsparticles.bundle.min.js"></script>

  <style>
    body {
      margin: 0;
      background: linear-gradient(black, #1a001a);
      font-family: sans-serif;
    }

    #particles {
      position: fixed;
      width: 100%;
      height: 100%;
      z-index: 0;
      pointer-events: none; /* 🔥 IMPORTANTE */
    }

    model-viewer {
      position: relative;
      z-index: 1;
      width: 100%;
      height: 80vh;
    }

    h1 {
      color: #ff4da6;
      text-align: center;
      text-shadow: 0 0 10px #ff4da6;
    }

    p {
      color: white;
      text-align: center;
    }
  </style>
</head>

<body>

<h1>LORENA MARTINS</h1>

<div id="particles"></div>

<model-viewer
  src="./logo_atual.glb"
  ar
  ar-modes="scene-viewer webxr quick-look"
  camera-controls
  auto-rotate
  rotation-per-second="20deg"

  environment-image="https://modelviewer.dev/shared-assets/environments/venice_sunset_1k.hdr"

  exposure="1.4"
  shadow-intensity="1"
  shadow-softness="1"
  camera-orbit="0deg 75deg 2m">
</model-viewer>

<p>
  Toque em "Ver em AR" para visualizar sua logo no mundo real ✨
</p>

<script>
tsParticles.load("particles", {
  particles: {
    number: { value: 40 },
    color: { value: "#ff4da6" },
    shape: { type: "circle" },
    opacity: {
      value: 0.6,
      animation: { enable: true, speed: 1 }
    },
    size: {
      value: 3,
      random: true
    },
    move: {
      enable: true,
      speed: 1
    }
  },
  background: {
    color: "transparent"
  }
});
</script>

</body>
</html>
