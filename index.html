<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <script type="module" src="https://unpkg.com/@google/model-viewer/dist/model-viewer.min.js"></script>
</head>

<body style="margin:0; background: linear-gradient(black, #1a001a);">

<h1 style="color:#ff4da6; text-align:center; font-family:sans-serif;">
  LORENA MARTINS
</h1>

<model-viewer
  src="logo_atual.glb"
  ar
  ar-modes="scene-viewer webxr quick-look"
  camera-controls
  auto-rotate
  
  environment-image="neutral"
  
  exposure="1.4"
  shadow-intensity="1"
  shadow-softness="1"
  
  camera-orbit="0deg 75deg 2m"
  
  style="width:100%; height:80vh;">
</model-viewer>

<p style="color:white; text-align:center; font-family:sans-serif;">
  Toque em "Ver em AR" para visualizar sua logo no mundo real ✨
</p>

</body>
</html>
